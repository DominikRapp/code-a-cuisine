<main class="preferences-step" aria-labelledby="preferences-step-title">
    <header class="preferences-step__header" aria-label="Code à Cuisine">
        <a class="preferences-step__logo-link" href="/" aria-label="Go to home page">
            <img class="preferences-step__logo" src="assets/images/svg/green-logo.svg" alt="Code à Cuisine" />
        </a>

        <a class="preferences-step__back-link" href="/generate/ingredients" aria-label="Go back to ingredients">
            <img class="preferences-step__back-image" src="assets/images/svg/back-arrow.svg" alt=""
                aria-hidden="true" />
            <span class="preferences-step__back-text">Ingredients</span>
        </a>
    </header>

    <section class="preferences-step__intro">
        <h1 id="preferences-step-title" class="preferences-step__title">
            Choose your preferences
        </h1>
    </section>

    <section class="preferences-step__counters" aria-label="Recipe counters">
        <div class="preferences-step__counter-group">
            <h2 class="preferences-step__counter-title">
                How many portions you need?
            </h2>

            <div class="preferences-step__counter-controls" aria-label="Portion amount">
                <button class="preferences-step__counter-button" type="button" aria-label="Decrease portions">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path

                    </svg>
                </button>

                <span class="preferences-step__counter-value" aria-live="polite">0</span>
                <span class="preferences-step__counter-label">Portions</span>

                <button class="preferences-step__counter-button" type="button" aria-label="Increase portions">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M8.33333 11.6667V13.8889C8.33333 14.3519 8.49537 14.7454 8.81944 15.0694C9.14352 15.3935 9.53704 15.5556 10 15.5556C10.463 15.5556 10.8565 15.3935 11.1806 15.0694C11.5046 14.7454 11.6667 14.3519 11.6667 13.8889V11.6667H13.8889C14.3519 11.6667 14.7454 11.5046 15.0694 11.1806C15.3935 10.8565 15.5556 10.463 15.5556 10C15.5556 9.53704 15.3935 9.14352 15.0694 8.81944C14.7454 8.49537 14.3519 8.33333 13.8889 8.33333H11.6667V6.11111C11.6667 5.64815 11.5046 5.25463 11.1806 4.93056C10.8565 4.60648 10.463 4.44444 10 4.44444C9.53704 4.44444 9.14352 4.60648 8.81944 4.93056C8.49537 5.25463 8.33333 5.64815 8.33333 6.11111V8.33333H6.11111C5.64815 8.33333 5.25463 8.49537 4.93056 8.81944C4.60648 9.14352 4.44444 9.53704 4.44444 10C4.44444 10.463 4.60648 10.8565 4.93056 11.1806C5.25463 11.5046 5.64815 11.6667 6.11111 11.6667H8.33333ZM2.22222 20C1.61111 20 1.08796 19.7824 0.652778 19.3472C0.217593 18.912 0 18.3889 0 17.7778V2.22222C0 1.61111 0.217593 1.08796 0.652778 0.652778C1.08796 0.217593 1.61111 0 2.22222 0H17.7778C18.3889 0 18.912 0.217593 19.3472 0.652778C19.7824 1.08796 20 1.61111 20 2.22222V17.7778C20 18.3889 19.7824 18.912 19.3472 19.3472C18.912 19.7824 18.3889 20 17.7778 20H2.22222ZM2.22222 17.7778H17.7778V2.22222H2.22222V17.7778Z"
                            fill="currentColor" />
                    </svg>
                </button>
            </div>
        </div>

        <div class="preferences-step__counter-group">
            <h2 class="preferences-step__counter-title">
                How many are cooking?
            </h2>

            <div class="preferences-step__counter-controls" aria-label="Cooking person amount">
                <button class="preferences-step__counter-button" type="button" aria-label="Decrease cooking persons">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M5.55556 11.1111H14.4444C14.7593 11.1111 15.0231 11.0046 15.2361 10.7917C15.4491 10.5787 15.5556 10.3148 15.5556 10C15.5556 9.68519 15.4491 9.4213 15.2361 9.20833C15.0231 8.99537 14.7593 8.88889 14.4444 8.88889H5.55556C5.24074 8.88889 4.97685 8.99537 4.76389 9.20833C4.55093 9.4213 4.44444 9.68519 4.44444 10C4.44444 10.3148 4.55093 10.5787 4.76389 10.7917C4.97685 11.0046 5.24074 11.1111 5.55556 11.1111ZM2.22222 20C1.61111 20 1.08796 19.7824 0.652778 19.3472C0.217593 18.912 0 18.3889 0 17.7778V2.22222C0 1.61111 0.217593 1.08796 0.652778 0.652778C1.08796 0.217593 1.61111 0 2.22222 0H17.7778C18.3889 0 18.912 0.217593 19.3472 0.652778C19.7824 1.08796 20 1.61111 20 2.22222V17.7778C20 18.3889 19.7824 18.912 19.3472 19.3472C18.912 19.7824 18.3889 20 17.7778 20H2.22222ZM2.22222 17.7778H17.7778V2.22222H2.22222V17.7778Z"
                            fill="#10310B" />
                    </svg>
                </button>

                <span class="preferences-step__counter-value" aria-live="polite">0</span>
                <span class="preferences-step__counter-label">Person</span>

                <button class="preferences-step__counter-button" type="button" aria-label="Increase cooking persons">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M8.33333 11.6667V13.8889C8.33333 14.3519 8.49537 14.7454 8.81944 15.0694C9.14352 15.3935 9.53704 15.5556 10 15.5556C10.463 15.5556 10.8565 15.3935 11.1806 15.0694C11.5046 14.7454 11.6667 14.3519 11.6667 13.8889V11.6667H13.8889C14.3519 11.6667 14.7454 11.5046 15.0694 11.1806C15.3935 10.8565 15.5556 10.463 15.5556 10C15.5556 9.53704 15.3935 9.14352 15.0694 8.81944C14.7454 8.49537 14.3519 8.33333 13.8889 8.33333H11.6667V6.11111C11.6667 5.64815 11.5046 5.25463 11.1806 4.93056C10.8565 4.60648 10.463 4.44444 10 4.44444C9.53704 4.44444 9.14352 4.60648 8.81944 4.93056C8.49537 5.25463 8.33333 5.64815 8.33333 6.11111V8.33333H6.11111C5.64815 8.33333 5.25463 8.49537 4.93056 8.81944C4.60648 9.14352 4.44444 9.53704 4.44444 10C4.44444 10.463 4.60648 10.8565 4.93056 11.1806C5.25463 11.5046 5.64815 11.6667 6.11111 11.6667H8.33333ZM2.22222 20C1.61111 20 1.08796 19.7824 0.652778 19.3472C0.217593 18.912 0 18.3889 0 17.7778V2.22222C0 1.61111 0.217593 1.08796 0.652778 0.652778C1.08796 0.217593 1.61111 0 2.22222 0H17.7778C18.3889 0 18.912 0.217593 19.3472 0.652778C19.7824 1.08796 20 1.61111 20 2.22222V17.7778C20 18.3889 19.7824 18.912 19.3472 19.3472C18.912 19.7824 18.3889 20 17.7778 20H2.22222ZM2.22222 17.7778H17.7778V2.22222H2.22222V17.7778Z"
                            fill="#10310B" />
                    </svg>
                </button>
            </div>
        </div>
    </section>

    <section class="preferences-step__options-card" aria-label="Recipe preferences">
        <fieldset class="preferences-step__option-section">
            <legend class="preferences-step__section-title">
                <img class="preferences-step__section-icon" src="assets/images/svg/clock.svg" alt=""
                    aria-hidden="true" />
                Cooking time:
            </legend>

            <div class="preferences-step__time-options">
                <label class="preferences-step__tag-label">
                    <input class="preferences-step__tag-input" type="radio" name="cookingTime" value="quick" />
                    <span class="preferences-step__tag">Quick</span>
                    <span class="preferences-step__tag-note">ab to 20min</span>
                </label>

                <label class="preferences-step__tag-label">
                    <input class="preferences-step__tag-input" type="radio" name="cookingTime" value="medium" />
                    <span class="preferences-step__tag">Medium</span>
                    <span class="preferences-step__tag-note">25-40min</span>
                </label>

                <label class="preferences-step__tag-label">
                    <input class="preferences-step__tag-input" type="radio" name="cookingTime" value="complex" />
                    <span class="preferences-step__tag">Complex</span>
                    <span class="preferences-step__tag-note">over 45min</span>
                </label>
            </div>
        </fieldset>

        <fieldset class="preferences-step__option-section">
            <legend class="preferences-step__section-title">
                <img class="preferences-step__section-icon" src="assets/images/svg/world.svg" alt=""
                    aria-hidden="true" />
                Cuisine
            </legend>

            <div class="preferences-step__tag-grid">
                <label class="preferences-step__tag-label">
                    <input class="preferences-step__tag-input" type="radio" name="cuisine" value="german" />
                    <span class="preferences-step__tag">German</span>
                </label>

                <label class="preferences-step__tag-label">
                    <input class="preferences-step__tag-input" type="radio" name="cuisine" value="italian" />
                    <span class="preferences-step__tag">Italian</span>
                </label>

                <label class="preferences-step__tag-label">
                    <input class="preferences-step__tag-input" type="radio" name="cuisine" value="indian" />
                    <span class="preferences-step__tag">Indian</span>
                </label>

                <label class="preferences-step__tag-label">
                    <input class="preferences-step__tag-input" type="radio" name="cuisine" value="japanese" />
                    <span class="preferences-step__tag">Japanese</span>
                </label>

                <label class="preferences-step__tag-label">
                    <input class="preferences-step__tag-input" type="radio" name="cuisine" value="gourmet" />
                    <span class="preferences-step__tag">Gourmet</span>
                </label>

                <label class="preferences-step__tag-label">
                    <input class="preferences-step__tag-input" type="radio" name="cuisine" value="fusion" />
                    <span class="preferences-step__tag">Fusion</span>
                </label>
            </div>
        </fieldset>

        <fieldset class="preferences-step__option-section">
            <legend class="preferences-step__section-title">
                <img class="preferences-step__section-icon" src="assets/images/svg/fork-spoon.svg" alt=""
                    aria-hidden="true" />
                Diet preferences
            </legend>

            <div class="preferences-step__tag-grid">
                <label class="preferences-step__tag-label">
                    <input class="preferences-step__tag-input" type="radio" name="diet" value="vegetarian" />
                    <span class="preferences-step__tag">Vegetarian</span>
                </label>

                <label class="preferences-step__tag-label">
                    <input class="preferences-step__tag-input" type="radio" name="diet" value="vegan" />
                    <span class="preferences-step__tag">Vegan</span>
                </label>

                <label class="preferences-step__tag-label">
                    <input class="preferences-step__tag-input" type="radio" name="diet" value="keto" />
                    <span class="preferences-step__tag">Keto</span>
                </label>

                <label class="preferences-step__tag-label">
                    <input class="preferences-step__tag-input" type="radio" name="diet" value="none" />
                    <span class="preferences-step__tag">No preferences</span>
                </label>
            </div>
        </fieldset>
    </section>

    <nav class="preferences-step__navigation" aria-label="Recipe generation navigation">
        <a class="preferences-step__generate-link" href="/generate/loading">
            Generate a recipe
        </a>
    </nav>
</main>
