<app-page-shell>
  <app-content-container>
    <main class="home-hero" aria-labelledby="home-hero-title">
      <section class="home-hero__left">
        <header class="home-hero__header" aria-label="Code à Cuisine">
          <img class="home-hero__logo app-logo" src="assets/images/svg/white-logo.svg" alt="Code à Cuisine" />
        </header>

        <div class="home-hero__content">
          <p class="home-hero__eyebrow">AI-Powered recipe generator</p>

          <h1 id="home-hero-title" class="home-hero__title">
            Code à Cuisine
          </h1>

          <a class="home-hero__start-link" routerLink="/generate/ingredients" (click)="startNewRecipe()">
            Get started
          </a>
        </div>

        <footer class="home-hero__footer">
          <p class="home-hero__footer-title">Hungry for inspiration?</p>

          <a class="home-hero__cookbook-link" routerLink="/cookbook">
            <span class="home-hero__cookbook-text">Go to cookbook</span>

            <img class="home-hero__cookbook-icon" src="assets/images/svg/back-arrow-creamy.svg" alt=""
              aria-hidden="true" />
          </a>
        </footer>
        <nav class="home-hero__legal-links" aria-label="Legal information">
          <a class="home-hero__legal-link" routerLink="/imprint">Imprint</a>

          <span class="home-hero__legal-separator" aria-hidden="true">|</span>

          <a class="home-hero__legal-link" routerLink="/privacy">Privacy</a>
        </nav>
      </section>

      <section class="home-hero__right" aria-hidden="true">
        <img class="home-hero__image" src="assets/images/png/hero.png" alt="" />
      </section>
    </main>
  </app-content-container>
</app-page-shell>
